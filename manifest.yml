modules:
  jira:adminPage:
    - key: jira-config-exporter
      resource: main
      resolver:
        function: resolver
      render: native
      title: Jira Configuration Exporter
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.tsx
permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - manage:jira-configuration
    - manage:jira-project
    - storage:app
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/b4eeaa84-39dd-4ea6-abe0-5d2eea9e8aac

